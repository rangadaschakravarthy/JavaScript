<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Utility Function Library — Day 10 Mini-Project</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; box-sizing: border-box; }
    input { background: #090d16; border: 1px solid #334155; color: #38bdf8; font-family: monospace; }
    button { background: #38bdf8; color: #0f172a; border: none; font-weight: bold; cursor: pointer; }
    .output { background: #090d16; padding: 12px; border-radius: 4px; border: 1px solid #334155; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🛠️ Utility Function Library</h2>
    <label>Enter Number A:</label>
    <input type="number" id="numA" value="10">
    <label>Enter Number B:</label>
    <input type="number" id="numB" value="25">
    <button id="runBtn">Run Utility Checks</button>
    <div id="output" class="output">Click Run to evaluate functions...</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
