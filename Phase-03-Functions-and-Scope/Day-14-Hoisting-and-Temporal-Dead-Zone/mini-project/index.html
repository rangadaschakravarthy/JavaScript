<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hoisting Detective — Day 14 Mini-Project</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; box-sizing: border-box; }
    select { background: #090d16; border: 1px solid #334155; color: #38bdf8; font-family: monospace; }
    button { background: #38bdf8; color: #0f172a; border: none; font-weight: bold; cursor: pointer; }
    .output { background: #090d16; padding: 12px; border-radius: 4px; border: 1px solid #334155; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🕵️ Hoisting Detective</h2>
    <label>Select Hoisting Case:</label>
    <select id="caseSelect">
      <option value="funcDecl">Function Declaration Early Call</option>
      <option value="varHoist">var Early Read (undefined)</option>
      <option value="letTDZ">let / const Early Read (TDZ ReferenceError)</option>
      <option value="varExpr">var Function Expression Early Call (TypeError)</option>
    </select>
    <button id="runBtn">Analyze Case</button>
    <div id="output" class="output">Select case and click Analyze...</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
