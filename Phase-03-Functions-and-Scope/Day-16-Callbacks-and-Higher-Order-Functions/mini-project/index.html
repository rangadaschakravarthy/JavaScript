<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Callback Task Runner — Day 16 Mini-Project</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; cursor: pointer; }
    .output { background: #090d16; padding: 12px; border-radius: 4px; border: 1px solid #334155; font-family: monospace; white-space: pre-wrap; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🏃 Callback Task Runner</h2>
    <p>Executes task functions sequentially with callback notifications:</p>
    <button id="runBtn">Run Task Pipeline</button>
    <div id="output" class="output">Click Run Task Pipeline...</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
