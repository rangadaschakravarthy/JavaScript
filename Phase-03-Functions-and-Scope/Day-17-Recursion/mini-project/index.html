<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recursive Number Toolkit — Day 17 Mini-Project</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    select, input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; box-sizing: border-box; }
    select, input { background: #090d16; border: 1px solid #334155; color: #38bdf8; font-family: monospace; }
    button { background: #38bdf8; color: #0f172a; border: none; font-weight: bold; cursor: pointer; }
    .output { background: #090d16; padding: 12px; border-radius: 4px; border: 1px solid #334155; font-family: monospace; white-space: pre-wrap; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔄 Recursive Number Toolkit</h2>
    <label>Select Recursive Algorithm:</label>
    <select id="algoSelect">
      <option value="fact">Factorial n!</option>
      <option value="fib">Fibonacci F(n)</option>
      <option value="pow">Power (base^exp)</option>
      <option value="digits">Digit Sum</option>
      <option value="reverse">String Reversal</option>
    </select>
    <label>Input Parameter (n / string):</label>
    <input type="text" id="valInput" value="5">
    <button id="runBtn">Execute Recursive Calculation</button>
    <div id="output" class="output">Select algorithm and click Execute...</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
